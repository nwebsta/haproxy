global
	log /dev/log	local0
	log /dev/log	local1 notice
	chroot /var/lib/haproxy
	stats socket /run/haproxy/admin.sock mode 660 level admin
	stats timeout 30s
	user haproxy
	group haproxy
	daemon

	# Default SSL material locations
	ca-base /etc/ssl/certs
	crt-base /etc/ssl/private

	# See: https://ssl-config.mozilla.org/#server=haproxy&server-version=2.0.3&config=intermediate
        ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
        ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
        ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
	log	global
	mode	http
	option	httplog
	option	dontlognull
        timeout connect 5000
        timeout client  50000
        timeout server  50000
	errorfile 400 /etc/haproxy/errors/400.http
	errorfile 403 /etc/haproxy/errors/403.http
	errorfile 408 /etc/haproxy/errors/408.http
	errorfile 500 /etc/haproxy/errors/500.http
	errorfile 502 /etc/haproxy/errors/502.http
	errorfile 503 /etc/haproxy/errors/503.http
	errorfile 504 /etc/haproxy/errors/504.http

frontend http_in
        mode http
        option httplog
	option forwardfor
        bind 203.0.113.10:80
	#acl acl_142 hdr(host) -i nextcloud.example.de
	acl acl_141 hdr(host) -i seafile.example.de   
  #acl acl_109 hdr(host) -i amp.example.de
	acl acl_151 hdr(host) -i -f /etc/haproxy/mailurlhttp
  acl acl_152 hdr(host) -i -f /etc/haproxy/kunde
	#acl acl_102 hdr(host) -i -f /etc/haproxy/allweb
	acl acl_103 hdr(host) -i updatedns.example.de
  acl acl_121 hdr(host) -i kq.example.de

	http-request redirect scheme https if acl_151


	#use_backend server_142 if acl_142
  #use_backend server_109 if acl_109
	use_backend server_141 if acl_141
	use_backend server_151 if acl_151
  use_backend server_152 if acl_152
	#use_backend server_102 if acl_102
	use_backend server_103 if acl_103
  use_backend server_121 if acl_121

backend server_142
	mode http
	server server1 10.0.0.42:80 send-proxy-v2  

backend server_109
  mode http
  server server1 10.0.0.9:80 send-proxy
        
backend server_141
  mode http
  server server1 10.0.0.41:80  

backend server_151
	mode http
	server server1 10.0.0.51:8080
  
backend server_152
	mode http 
	server server1 10.0.0.152:80 send-proxy

backend server_102
	mode http
	server server1 10.0.0.2:80 send-proxy-v2 

backend server_103
	mode http
	server server1 10.0.0.3:80
  
backend server_121
	mode http
	server server1 10.0.0.21:80 send-proxy


frontend https_in
  mode tcp
  option tcplog
  bind 203.0.113.10:443
  acl tls req.ssl_hello_type 1
  tcp-request inspect-delay 5s
  tcp-request content accept if tls

	#acl acl_142 req.ssl_sni -i nextcloud.example.de        
  #acl acl_109 req.ssl_sni -i amp.example.de
  acl acl_141 req.ssl_sni -i seafile.example.de
	acl acl_151 req.ssl_sni -i -f /etc/haproxy/mailurlhttp
  acl acl_152 req.ssl_sni -i -f /etc/haproxy/kunde
	#acl acl_102 req.ssl_sni -i -f /etc/haproxy/allweb
	acl acl_103 req.ssl_sni -i updatedns.example.de
  acl acl_121 req.ssl_sni -i kq.example.de

	#use_backend server_142_SSL if acl_142
  #use_backend server_109_SSL if acl_109
	use_backend server_141_SSL if acl_141
	use_backend server_151_SSL if acl_151
  use_backend server_152_SSL if acl_152
	#use_backend server_102_SSL if acl_102
	use_backend server_103_SSL if acl_103
  use_backend server_121_SSL if acl_121

backend server_142_SSL
	mode tcp
	option ssl-hello-chk
	server server1 10.0.0.42:443 send-proxy-v2 

backend server_109_SSL
  mode tcp
  option ssl-hello-chk
  server server1 10.0.0.9:443 send-proxy

backend server_141_SSL
  mode tcp
  option ssl-hello-chk
  server server1 10.0.0.41:443 send-proxy  

backend server_151_SSL
	mode tcp
  option ssl-hello-chk
	server server1 10.0.0.51:8443
  
backend server_152_SSL
	mode tcp
  option ssl-hello-chk
	server server1 10.0.0.152:443 send-proxy

backend server_102_SSL
	mode tcp
  option ssl-hello-chk
	server server1 10.0.0.2:443 send-proxy-v2 

backend server_103_SSL
	mode tcp
	option ssl-hello-chk
	server server1 10.0.0.3:443 send-proxy
  
backend server_121_SSL
	mode tcp
	option ssl-hello-chk
	server server1 10.0.0.21:443 send-proxy

